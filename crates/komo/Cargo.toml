[package]
name = "komo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# §13.4：clap 分发；`komo` / `komo resume` → client 的 TUI；操作子命令 → client；
# `komo gateway` → gateway。rustls 只为在 main 里安装 ring provider。
[[bin]]
name = "komo"
path = "src/main.rs"

[dependencies]
# 协议类型（请求 / 响应体）——client 的每个方法都收发它们。kernel 是叶子 crate，
# 加这一条不改变依赖图的形状（§13.4 的两条支线仍在 bin 汇合）。
komo-kernel = { workspace = true }
komo-client = { workspace = true }
komo-gateway = { workspace = true }
time = { workspace = true }
clap = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
# 渠道 feature 的直通口，好让 `cargo build --no-default-features` 在工作区根部也有意义。
default = ["feishu", "telegram", "wechat"]
feishu = ["komo-gateway/feishu"]
telegram = ["komo-gateway/telegram"]
wechat = ["komo-gateway/wechat"]
