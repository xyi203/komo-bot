[package]
name = "komo-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# §13.4：唯一依赖 toasty / turso 的 crate。
[dependencies]
komo-kernel = { workspace = true }
toasty = { workspace = true }
# §8.2：`Turso::file(path).concurrent_writes()` 这个具体驱动类型 toasty 不再导出，只能
# 直接依赖驱动包。工作区的 `[patch.crates-io]` 把它指向 vendor/ 那一份（关掉 `fts`）。
# **待编排者把它提到 `[workspace.dependencies]`**——版本号现在写在这里，与 toasty 的
# major 手工对齐。
toasty-driver-turso = { workspace = true }
turso = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util"] }
sha2 = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
# 只在 `test-support` 下进入构建（见 [features]）。
tempfile = { workspace = true, optional = true }

[features]
# §13.4：跨 crate 需要的构造器放在 test-support 后面，只作为 dev-dependency 启用。
test-support = ["dep:tempfile"]

[dev-dependencies]
komo-kernel = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
