[workspace]
resolver = "2"
members = [
    "crates/komo-kernel",
    "crates/komo-store",
    "crates/komo-runtime",
    "crates/komo-gateway",
    "crates/komo-client",
    "crates/komo",
]

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

# 依赖清单与禁用项照 docs/komo_bot.md §13.4。特性在这里写死，成员 crate 只写
# `workspace = true`（必要时按 §13.4 的 crate 行补自己需要的可加特性）。
# 不引入 rmcp / image / strum / derive_more / bon。
[workspace.dependencies]
# 内部 crate，依赖只向下：kernel ← store ← runtime ← gateway；kernel ← client。
komo-kernel = { path = "crates/komo-kernel" }
komo-store = { path = "crates/komo-store" }
komo-runtime = { path = "crates/komo-runtime" }
komo-gateway = { path = "crates/komo-gateway", default-features = false }
komo-client = { path = "crates/komo-client" }

# §13.4：去掉 `sqlite` 特性拉进来的 rusqlite / libsqlite3-sys。
toasty = { version = "0.10.0", default-features = false, features = ["turso"] }
# §13.4：与 toasty-driver-turso 同 major（0.10 依赖 turso ^0.7），工作区唯一。
# spikes/store.md：关掉 turso 默认特性 `fts`（MVCC 下本来就被拒绝），tantivy / zstd-sys / lz4 与
# 一条 C 工具链随之消失，少 62 个编译单元；toasty-driver-turso 也 vendor 一份只改 4 行 manifest 对齐。
turso = { version = "0.7.2", default-features = false, features = ["mimalloc"] }
# toasty 0.10 不再导出驱动类型（`Turso::file(..).concurrent_writes()` 只在驱动里），store 直接依赖它；
# [patch.crates-io] 已把它指向 vendor/ 那一份。
toasty-driver-turso = { version = "0.10.0", default-features = false }

# §13.4：`rustls` 特性 = `__rustls-aws-lc-rs`；`no-provider` 后由 komo 在 main 里
# 安装 ring provider，且必须在飞书 ws 线程启动之前。
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls-no-provider",
    "json",
    "stream",
    "charset",
] }
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }

# §13.4：按需特性，不用 `full`；kernel 不依赖 tokio。
tokio = { version = "1.53.1", default-features = false, features = [
    "rt",
    "macros",
    "sync",
    "time",
] }

# §13.4：仅 gateway。
axum = "0.8.9"
tower-http = { version = "0.6", default-features = false, features = ["cors"] }

# §13.4：仅 bin。
clap = { version = "4.6.7", features = ["derive"] }

# §13.4：仅 gateway，feature `feishu`（默认开）。只要 ws 长连接；事件负载用
# register_raw 拿原始 JSON 自己解析。
openlark = { version = "0.20.0", default-features = false, features = ["websocket"] }
# §13.4：仅 gateway，feature `wechat`（默认开）。它 pin reqwest 0.12 + native-tls，
# 带来一份 reqwest / hyper 重复——接受。Linux 下不 vendored openssl。
wechatbot = "0.4.0"
# §13.4：微信登录二维码渲染为终端字符，不需要 `image`。
qrcode = { version = "0.14.1", default-features = false }

# §13.4：仅 komo-client，在 client 支线上与 gateway 并行编译。
ratatui = "0.30.2"
crossterm = "0.29.0"
pulldown-cmark = "0.13.4"

# §3 配置热重载：进程内唯一的 Arc<ConfigSnapshot> 原子替换。
arc-swap = "1.9.2"

croner = { version = "4.0.0", default-features = false }
async-trait = "0.1.92"
thiserror = "2.0.20"
uuid = { version = "1.26.1", features = ["v7", "serde"] }
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"

# W3 预声明（避免并行子代理碰同一个文件）。§13.2：配置 TOML、日志 tracing、tokio-util。
toml = "1.1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# runtime 的 ZoneResolver 实现（§10 / §13.5）：自带 tzdb，kernel 侧仍只用 `time`，靠 unix 时间戳换算。
jiff = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
bytes = "1"
tokio-util = { version = "0.7", features = ["io", "codec"] }
tempfile = "3"

# §13.4 profile：逐字照抄。
[profile.dev.package."*"]
debug = "none"               # 第三方不带调试信息

[profile.dev]
debug = "line-tables-only"   # 自己的 crate 保留行号即可

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 16

# §13.4 / spikes/wechat.md：wechatbot 0.4.0 上游把 reqwest 0.12 默认特性（native-tls → openssl-sys）
# 留着不管，特性只加不减，工作区无法关掉；vendor 一份只改它的 reqwest 行，走工作区同一份
# rustls 0.23 + ring provider。openssl / native-tls 整条构建链消失，Fedora 不需要 openssl-devel。
[patch.crates-io]
wechatbot = { path = "vendor/wechatbot" }
toasty-driver-turso = { path = "vendor/toasty-driver-turso" }
