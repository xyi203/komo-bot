[workspace]
resolver = "2"
members = [
    "crates/komo-channel",
    "crates/komo-kernel",
    "crates/komo-agent",
    "crates/komo-store",
    "crates/komo-runtime",
    "crates/komo-gateway",
    "crates/komo-client",
    "crates/komo",
]

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

# 依赖清单与禁用项照 docs/komo_bot.md §13.4。特性在这里写死，成员 crate 只写
# `workspace = true`（必要时按 §13.4 的 crate 行补自己需要的可加特性）。
# 不引入 image / strum / derive_more / bon。
[workspace.dependencies]
# 内部 crate，依赖只向下：kernel ← store ← runtime ← gateway；kernel ← agent ← gateway；
# kernel ← client。
komo-channel = { path = "crates/komo-channel", default-features = false }
komo-kernel = { path = "crates/komo-kernel" }
komo-agent = { path = "crates/komo-agent" }
komo-store = { path = "crates/komo-store" }
komo-runtime = { path = "crates/komo-runtime" }
komo-gateway = { path = "crates/komo-gateway", default-features = false }
komo-client = { path = "crates/komo-client" }

# §13.4：去掉 `sqlite` 特性拉进来的 rusqlite / libsqlite3-sys。
toasty = { version = "0.11.0", default-features = false, features = ["turso"] }
# §13.4：与 toasty-driver-turso 同 major（0.11 依赖 turso ^0.7），工作区唯一；升到 0.8 会链进两份 turso、C 符号重名。
# spikes/store.md：关掉 turso 默认特性 `fts`（MVCC 下本来就被拒绝），tantivy / zstd-sys / lz4 与
# 一条 C 工具链随之消失，少 62 个编译单元；toasty-driver-turso 0.11 上游已对 turso 关默认特性，不再 vendor。
turso = { version = "0.7.2", default-features = false, features = ["mimalloc"] }
# toasty 0.10 起不再导出驱动类型（`Turso::file(..).concurrent_writes()` 只在驱动里），store 直接依赖它。
toasty-driver-turso = { version = "0.11.0", default-features = false }

# §13.4：`rustls` 特性 = `__rustls-aws-lc-rs`；`no-provider` 后由 komo 在 main 里
# 安装 ring provider，且必须在飞书 ws 线程启动之前。
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls-no-provider",
    "json",
    "stream",
    "charset",
    # ChatGPT OAuth 的 token 端点要 `application/x-www-form-urlencoded`（§13.3、komo_bot.md）。
    "form",
] }
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }
# §13.4：MCP 客户端（docs/mcp.md）。只开客户端与两种传输；HTTP 走工作区同一个
# reqwest 0.13（rustls-no-provider），不带 server 宏。`auth`：OAuth 授权码 + PKCE
# 与 token 刷新（docs/mcp.md §2.1，2026-10-14），带进 oauth2（不开默认特性）与 url。
rmcp = { version = "3.3.0", default-features = false, features = [
    "client",
    "auth",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "reqwest-tls-no-provider",
] }

# §13.4：按需特性，不用 `full`；kernel 不依赖 tokio。
tokio = { version = "1.53.2", default-features = false, features = [
    "rt",
    "macros",
    "sync",
    "time",
] }

# §13.4：仅 gateway。
axum = "0.8.9"
tower-http = { version = "0.7.1", default-features = false, features = [
    "cors",
] }

# §13.4：仅 bin。
clap = { version = "4.6.7", features = ["derive"] }

# §13.4：仅 komo-channel 的 feishu feature。只要 ws 长连接；事件负载用
# register_raw 拿原始 JSON 自己解析。
openlark = { version = "0.21.0", default-features = false, features = [
    "websocket",
] }
# §13.4：仅 komo-channel 的 wechat feature。它 pin reqwest 0.12 + native-tls，
# 带来一份 reqwest / hyper 重复——接受。Linux 下不 vendored openssl。
wechatbot = "0.4.0"
# §13.4：微信登录二维码渲染为终端字符，不需要 `image`。
qrcode = { version = "0.14.1", default-features = false }

# §13.4：仅 komo-client，在 client 支线上与 gateway 并行编译。
ratatui = "0.30.2"
crossterm = "0.29.0"
pulldown-cmark = "0.13.4"

# §13.4：仅 komo (bin) 的 `komo update`——解发布包（release.yml 打的 tar.gz）。
# flate2 显式写 rust_backend（miniz_oxide，纯 Rust），不随上游默认后端变；两者都不带 C 工具链。
flate2 = { version = "1", default-features = false, features = [
    "rust_backend",
] }
tar = "0.4"

# §13.4：`rg` 工具用的搜索库——就是 ripgrep 那个仓库拆出来的书，**不起子进程、没有外部
# 二进制依赖**。默认特性集是空的（pcre2 / simd-accel 都不开），写出来是为了钉住这一点：
# 换引擎（PCRE2）会改掉"正则语法 = Rust regex"这个对模型可见的契约。
grep = { version = "0.4", default-features = false }
ignore = { version = "0.4", default-features = false }

# §3 配置热重载：进程内唯一的 Arc<ConfigSnapshot> 原子替换。
arc-swap = "1.9.2"

croner = { version = "4.0.1", default-features = false }
async-trait = "0.1.92"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v7", "serde"] }
time = { version = "0.3.55", features = [
    "serde",
    "formatting",
    "parsing",
    "macros",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
# ChatGPT OAuth 的 access_token / id_token 是 JWT：只 base64url 解 payload，不验签
# （§13.3）。0.22 已经是依赖树里解得最多的一份（reqwest 等间接拉入），钉住它不再添一份
# 重复版本。
base64 = "0.23.1"

# W3 预声明（避免并行子代理碰同一个文件）。§13.2：配置 TOML、日志 tracing、tokio-util。
toml = "1.1"
# config.toml 的未知键降级为警告：解析时收集被忽略的键路径（§3）。只依赖 serde。
serde_ignored = "0.1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# docs/observability.md §4：OpenTelemetry 只进 bin。OTLP/HTTP + protobuf，走工作区同一份 reqwest；
# 不开 grpc-tonic / logs。
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics"] }
tracing-opentelemetry = "0.34"
tracing-appender = { version = "0.2", default-features = false }
# runtime 的 ZoneResolver 实现（§10 / §13.5）：自带 tzdb，kernel 侧仍只用 `time`，靠 unix 时间戳换算。
jiff = "0.2.38"
futures-util = { version = "0.3", default-features = false, features = [
    "std",
    "sink",
] }
bytes = "1"
tokio-util = { version = "0.7.20", features = ["io", "codec"] }
tempfile = "3"
# Gateway 起来时抬"能开的文件数"（limits.rs）；codemode worker 的内存看门狗读 RSS、超限 SIGKILL
# （docs/codemode.md §4）。
libc = "0.2.190"
# codemode 的脚本引擎（docs/codemode.md §2）：pydantic Monty，精确钉版本——它的快照与
# `unstable` 访问器没有兼容保证，升级必须重跑回放集。`monty-alloc` 不能用：它要
# `#[global_allocator]`，与 turso 的 mimalloc 冲突（§13.4）。
monty = "=1.1.0"
monty-types = "=1.1.0"
# 只读文件挂载（docs/codemode.md §4）：同一个发布流，精确钉同一个版本。
monty-fs = "=1.1.0"
num-bigint = "0.4"

# §13.4 profile：逐字照抄。
[profile.dev.package."*"]
debug = "none" # 第三方不带调试信息

[profile.dev]
debug = "line-tables-only" # 自己的 crate 保留行号即可

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 16

# §13.4 / spikes/wechat.md：wechatbot 0.4.0 上游把 reqwest 0.12 默认特性（native-tls → openssl-sys）
# 留着不管，特性只加不减，工作区无法关掉；vendor 一份只改它的 reqwest 行，走工作区同一份
# rustls 0.23 + ring provider。openssl / native-tls 整条构建链消失，Fedora 不需要 openssl-devel。
[patch.crates-io]
wechatbot = { path = "vendor/wechatbot" }
