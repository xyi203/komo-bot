[package]
name = "komo-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# §13.4：只依赖 kernel——不认识 store / runtime。
[dependencies]
komo-kernel = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "io-util"] }
ratatui = { workspace = true }
crossterm = { workspace = true }
pulldown-cmark = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
jiff = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }

[dev-dependencies]
komo-kernel = { workspace = true, features = ["test-support"] }
# 假服务端（tokio TcpListener 手写 HTTP/SSE）只在测试里存在：`net` 挂在 dev-dependency
# 上，正式构建的 komo-client 不因此多一个 tokio 特性。
tokio = { workspace = true, features = ["rt-multi-thread", "io-util", "net", "macros", "time"] }
# reqwest 的 `rustls-no-provider` 在 `Client::build()` 处就要一个已安装的 provider，
# 否则 panic；正式构建里那是 `komo` 的 main 装的（§13.4 reqwest 行），测试进程里没有
# main，所以测试自己装一次。**只是 dev-dependency**：komo-client 的正式依赖不变。
rustls = { workspace = true }
# 网关重启那条自愈要一个真数据目录（发现文件写在 `<home>/runtime/gateway.json`）：
# 与 store / runtime / gateway 的测试用同一个临时目录工具。
tempfile = { workspace = true }
