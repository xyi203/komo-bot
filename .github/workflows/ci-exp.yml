# 临时实验：同一提交上并行比较几种测试方案的耗时，定稿后删除。
name: CI experiment
on:
  push:
    branches: [ci/speedup]
env:
  CARGO_TERM_COLOR: always
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
  nextest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-nextest }
      - run: cargo nextest run --workspace --no-tests=warn
      - run: cargo test --workspace --doc
  nextest-nodebug:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-nextest }
      - run: cargo nextest run --workspace --no-tests=warn
      - run: cargo test --workspace --doc
  split:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        part:
          - { name: gateway, args: "-p komo-gateway" }
          - { name: rest, args: "--workspace --exclude komo-gateway" }
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.part.name }}" }
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-nextest }
      - run: cargo nextest run ${{ matrix.part.args }} --no-tests=warn
      - run: cargo test ${{ matrix.part.args }} --doc
