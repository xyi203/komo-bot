name: Release

on:
  push:
    tags:
      - "v*"
      - "V*"
  # Build and checksum without publishing — the release step is tag-gated.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.asset_suffix }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            asset_suffix: darwin-arm64
            runner: macos-latest
          - target: x86_64-apple-darwin
            asset_suffix: darwin-amd64
            runner: macos-latest
          # Native runners, not cross-compilation: aws-lc-sys, the bundled
          # sqlite and the vendored OpenSSL all build C with the host toolchain.
          # 22.04 sets the glibc floor (2.35) for the published binaries.
          - target: x86_64-unknown-linux-gnu
            asset_suffix: linux-amd64
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            asset_suffix: linux-arm64
            runner: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      # libprotobuf-dev ships the well-known protos protoc resolves imports
      # against; protobuf-compiler alone fails on descriptor.proto (see Dockerfile).
      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/komo" "dist/komo"
          tar -czf "dist/komo-${{ matrix.asset_suffix }}.tar.gz" -C dist komo
          rm -f dist/komo
          ls -lh dist

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: komo-${{ matrix.asset_suffix }}
          path: dist/komo-${{ matrix.asset_suffix }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum komo-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Generate build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/komo-*.tar.gz
            dist/SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
