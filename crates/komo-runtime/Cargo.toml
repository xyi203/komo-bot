[package]
name = "komo-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# §13.4：日常改动落在这里；它从不重新展开 toasty 宏。
[dependencies]
komo-kernel = { workspace = true }
komo-store = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "fs", "process", "io-util"] }
arc-swap = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
toml = { workspace = true }
dotenvy = { workspace = true }
jiff = { workspace = true }
sha2 = { workspace = true }
futures-util = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
komo-kernel = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
# 心跳的测试要拨表：`#[tokio::test(start_paused = true)]` 需要 `test-util`。它只在
# dev 构建里开，生产的 tokio 特性集合不变（§13.4 的编译预算）。
tokio = { workspace = true, features = ["test-util"] }
