[package]
name = "komo-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# §13.4：gateway 看不到 toasty 类型（store 只通过 runtime 的构造函数暴露），也看不到 ratatui。
[dependencies]
komo-kernel = { workspace = true }
komo-runtime = { workspace = true }
# 只用 store 的构造函数与 repo 类型（Db / Coordinator / Turso*Repo / RecoveryStore），不碰 toasty 类型。
komo-store = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "fs"] }
reqwest = { workspace = true }
openlark = { workspace = true, optional = true }
wechatbot = { workspace = true, optional = true }
qrcode = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
arc-swap = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }
tokio-util = { workspace = true }
# 只在 `test-support` 下编进来：共用的集成测试脚手架（`service::test_support::harness`）
# 要一个临时目录与 TLS provider。生产构建里这两条不在依赖树上。
tempfile = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }

[features]
# §13.4：三个渠道各自一个 feature，默认全开。feature 的用处不是裁功能，是让
# `cargo tree -d` 能按渠道归因重复版本，以及某家 SDK 坏掉时能单独关掉它继续构建。
default = ["feishu", "telegram", "wechat"]
feishu = ["dep:openlark"]
telegram = []
wechat = ["dep:wechatbot", "dep:qrcode"]
# W5：集成测试（`tests/recovery`）要的故障注入口。只开这个 feature 时编进来的是
# `service::test_support` 里的注入表，生产构建里那张表根本不存在。
test-support = [
    "komo-kernel/test-support",
    "komo-store/test-support",
    "dep:tempfile",
    "dep:rustls",
]


[dev-dependencies]
# 自依赖：只给 test / bench 目标打开 `test-support`，`cargo test -p komo-gateway` 因此
# 不必带 `--features`，而 `cargo build` 仍然看不到注入口。
komo-gateway = { path = ".", features = ["test-support"] }
komo-kernel = { workspace = true, features = ["test-support"] }
# 测试里自己发 HTTP：reqwest 是 `rustls-no-provider`，provider 平时由 bin 的 `main` 装
# （§13.4），测试进程里没有那个 `main`，所以自己装一次。
rustls = { workspace = true }
komo-store = { workspace = true, features = ["test-support"] }
# W5：`tests/recovery/e2e.rs` 的 resume 那一步要走**真客户端**那条路（§14 的"随后 resume
# 原会话查看结果"说的就是 CLI）。client 不依赖 gateway，所以这条 dev-dependency 不成环。
komo-client = { workspace = true }
tempfile = { workspace = true }
