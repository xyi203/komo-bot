[package]
name = "komo-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# §13.4：日常改动落在这里；它从不重新展开 toasty 宏。
[dependencies]
komo-kernel = { workspace = true }
komo-store = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "fs", "process", "io-util"] }
arc-swap = { workspace = true }
# §13.4：`rg` 工具（内嵌 ripgrep 的搜索库，不起子进程）。
grep = { workspace = true }
ignore = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
toml = { workspace = true }
dotenvy = { workspace = true }
jiff = { workspace = true }
sha2 = { workspace = true }
futures-util = { workspace = true }
tokio-util = { workspace = true }
# ChatGPT OAuth 凭证的 JWT payload 解码（§13.3）。
base64 = { workspace = true }
# ChatGPT OAuth 凭证文件的原子写（临时文件 + rename，§13.3）。
tempfile = { workspace = true }

[dev-dependencies]
komo-kernel = { workspace = true, features = ["test-support"] }
# §47 / §48 的指标只进 trace：验收要把那两行抓出来数一数。dev 构建里才有。
tracing-subscriber = { workspace = true }
# 真机验收（`--ignored`）要自己发 HTTPS 请求，而 `reqwest` 是 rustls-no-provider：装
# provider 是**进程**的事（§13.4，bin 的 `main` 里那一行），测试进程得自己装一次。
rustls = { workspace = true }
# 心跳的测试要拨表：`#[tokio::test(start_paused = true)]` 需要 `test-util`。它只在
# dev 构建里开，生产的 tokio 特性集合不变（§13.4 的编译预算）。
tokio = { workspace = true, features = ["test-util"] }
