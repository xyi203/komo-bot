[package]
name = "komo-kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# §13.4：值类型、状态机、事件与 fold、cron 到期计算、
# §8.4 恢复决策表（纯函数）、协议线格式、全部 trait（§13.5）。不依赖 tokio。
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
croner = { workspace = true }
# §7.2 的 plan_hash、§8.3 的内容哈希与 §3 的凭证指纹都要一个真哈希；手写的散列哪怕
# 对，也不该住在与密钥相邻的代码里。
sha2 = { workspace = true }
# 只在 `ts` feature 下编进来（客户端协议类型生成，docs/clients.md D3）；默认构建不拉它。
ts-rs = { workspace = true, optional = true }

[features]
# §13.4：跨 crate 需要的替身放在 test-support 后面，只作为 dev-dependency 启用。
test-support = []
# 协议类型导出 TypeScript：`cargo test -p komo-kernel --features ts`（重新生成：加环境变量 KOMO_UPDATE_TS=1）。
ts = ["dep:ts-rs"]
