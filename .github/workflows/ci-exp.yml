# 临时实验：同一提交上并行比较几种测试方案的耗时，定稿后删除。
name: CI experiment
on:
  push:
    branches: [ci/speedup]
env:
  CARGO_TERM_COLOR: always
jobs:
  nextest-nodebug:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-nextest }
      - run: cargo nextest run --workspace --no-tests=warn
      - run: cargo test --workspace --doc
  p2:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    strategy:
      matrix:
        partition: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: p2
          save-if: ${{ matrix.partition == 1 }}
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-nextest }
      - run: cargo nextest run --workspace --partition count:${{ matrix.partition }}/2
