[package]
name = "komo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# §13.4：clap 分发；`komo` / `komo resume` → client 的 TUI；操作子命令 → client；
# `komo gateway` → gateway。rustls 只为在 main 里安装 ring provider。
[[bin]]
name = "komo"
path = "src/main.rs"

[dependencies]
# 协议类型（请求 / 响应体）——client 的每个方法都收发它们。kernel 是叶子 crate，
# 加这一条不改变依赖图的形状（§13.4 的两条支线仍在 bin 汇合）。
komo-kernel = { workspace = true }
komo-client = { workspace = true }
komo-gateway = { workspace = true }
time = { workspace = true }
clap = { workspace = true }
rustls = { workspace = true }
# "fs" / "io-util" 是 `komo update` 下载落盘要的；"net" 只有测试里的假服务端用。
# 三者都已在图里（store 要 fs、gateway 要 net），这里只是把话说全。
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "fs", "io-util", "net"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# `komo update`（§13.6）：发 HTTP、校验 sha256、解 tar.gz。**只进这一条命令的图**——
# gateway 与 runtime 谁也不更新自己，那两边的依赖清单不动。
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }

[dev-dependencies]
# 假 GitHub：一个真的 HTTP 服务端，跑在 loopback 上（与渠道的 fake 同一种做法）。
axum = { workspace = true }
tempfile = { workspace = true }

[features]
# 渠道 feature 的直通口，好让 `cargo build --no-default-features` 在工作区根部也有意义。
default = ["feishu", "telegram", "wechat"]
feishu = ["komo-gateway/feishu"]
telegram = ["komo-gateway/telegram"]
wechat = ["komo-gateway/wechat"]
